<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OG</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Inter+Tight:wght@800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(900px 600px at 90% -10%,#2a1b5e,transparent 60%),radial-gradient(600px 500px at -5% 110%,rgba(0,196,140,.22),transparent 60%),#0A0A0F;color:#F4F2EE;font-family:Inter,sans-serif;display:grid;grid-template-columns:1fr auto;align-items:center;padding:0 80px;box-sizing:border-box}
.k{font:500 18px/1 "JetBrains Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,242,238,.55);display:flex;gap:12px;align-items:center}
.k:before{content:"";width:10px;height:10px;border-radius:50%;background:#00C48C;box-shadow:0 0 14px #00C48C}
h1{font:800 88px/.95 "Inter Tight",sans-serif;letter-spacing:-.045em;margin:22px 0 18px}
h1 span{background:linear-gradient(90deg,#00C48C,#3D8BFF,#8567FF,#F2A516);-webkit-background-clip:text;color:transparent}
p{font-size:26px;color:rgba(244,242,238,.7);margin:0}
.icons{display:grid;grid-template-columns:repeat(2,120px);gap:22px;transform:rotate(-6deg)}
.icons img{width:120px;height:120px;border-radius:27px;box-shadow:0 20px 40px -10px rgba(0,0,0,.7)}
.icons img:nth-child(5){grid-column:1/3;justify-self:center}
</style></head><body>
<div><div class="k">Madrid · Senior iOS</div><h1>David Tejedor<br><span>SwiftUI apps.</span></h1><p>Senior iOS Developer · 5 apps of my own on the way</p></div>
<div class="icons"><img src="/assets/img/apps/schede-256.png"><img src="/assets/img/apps/keppi-256.png"><img src="/assets/img/apps/plantiario-256.png"><img src="/assets/img/apps/cooktribe.svg"><img src="/assets/img/apps/quicksound-256.png"></div>
</body></html>
